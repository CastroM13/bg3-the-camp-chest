name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that no game files are being published
        run: |
          bad=$(git ls-files | grep -iE '\.(pak|gr2|dds|gts|gtp|glb|gltf|bin|png|jpe?g|webp|loca|lsf|lsx)$' || true)
          if [ -n "$bad" ]; then echo "Refusing to publish game-like files:"; echo "$bad"; exit 1; fi

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html legal.html onboarding.js onboarding.css sw.js app engine lib _site/
          cp LICENSE LEGAL.md THIRD_PARTY_NOTICES.md _site/
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
